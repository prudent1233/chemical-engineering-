%22 fill-opacity=%22.8%22/%3E%3Ccircle cx=%22296%22 cy=%22368%22 r=%2210%22 fill=%22%23fff%22 fill-opacity=%22.75%22/%3E%3C/g%3E %3Cpath d=%22M226 106 V206 L128 358 Q112 388 132 402 Q142 410 158 410 H354 Q370 410 380 402 Q400 388 384 358 L286 206 V106%22 fill=%22none%22 stroke=%22%23eafffb%22 stroke-width=%2224%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22/%3E %3Crect x=%22198%22 y=%2280%22 width=%22116%22 height=%2230%22 rx=%2215%22 fill=%22%23eafffb%22/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--surf:255 255 255;--ink:#1c2a2e;--mut:#5d6f74;--acc:#0b7a75;--line:rgba(20,40,45,.14);--base:#dfe9e8;--a:.55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surf:22 34 38;--ink:#e4efee;--mut:#9fb3b6;--acc:#4fd1c5;--line:rgba(220,240,240,.16);--base:#0e1719;color-scheme:dark}}
:root[data-theme="dark"]{--surf:22 34 38;--ink:#e4efee;--mut:#9fb3b6;--acc:#4fd1c5;--line:rgba(220,240,240,.16);--base:#0e1719;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--base) center/cover fixed;font-size:14px}
.app{display:flex;height:100%}
.glass{background:rgb(var(--surf)/var(--a));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px}
nav{width:200px;padding:12px;margin:10px 0 10px 10px;display:flex;flex-direction:column;gap:4px;transition:width .15s;overflow:hidden;flex:none}
nav.c{width:58px}nav.c span{display:none}
nav h1{font-size:17px;margin:4px 6px 12px;white-space:nowrap}
nav button{display:flex;gap:10px;align-items:center;background:none;border:0;color:var(--ink);padding:9px 8px;border-radius:7px;cursor:pointer;font:inherit;text-align:left;white-space:nowrap}
nav button:hover{background:rgb(var(--surf)/.6)}nav button.on{background:var(--acc);color:#fff}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
main{flex:1;overflow:auto;padding:10px;min-width:0}
h2{margin:6px 4px 12px;font-size:20px}h3{margin:0 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{padding:14px}
.mut{color:var(--mut);font-size:12.5px}
input,select,textarea{font:inherit;color:var(--ink);background:rgb(var(--surf)/.7);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:220px;resize:vertical}
label{display:block;margin:8px 0 3px;font-size:12.5px;color:var(--mut)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit;width:auto}
.btn.g{background:rgb(var(--surf)/.7);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:0 0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{font-family:Consolas,monospace;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line);overflow-x:auto}
.res{font-size:18px;font-weight:600;color:var(--acc);margin:8px 0}
.err{color:#c0392b;margin-top:8px}
.li{padding:6px 8px;border-radius:6px;cursor:pointer;border:0;background:none;color:var(--ink);width:100%;text-align:left;font:inherit}
.li:hover,.li.on{background:rgb(var(--surf)/.7)}
.split{display:grid;grid-template-columns:230px 1fr;gap:10px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:8px 14px;border-radius:6px}
@media(max-width:700px){nav{width:58px}nav span{display:none}.split{grid-template-columns:1fr}}
nav{overflow-y:auto}.col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}main{min-height:0}
#top{margin:10px 10px 0;padding:7px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#top input{padding:6px 9px}
#sr,#nm{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:rgb(var(--surf)/.96);border:1px solid var(--line);border-radius:8px;z-index:20}#sr:empty,#nm:empty{display:none}#nm{left:auto;width:180px}
.logo{width:30px;height:30px;border-radius:50%;background:#f4c542;color:#222;display:grid;place-items:center;flex:none}
.lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:12px 6px 4px;white-space:nowrap}nav.c .lab{display:none}
.badge{margin-left:auto;background:rgb(var(--surf)/.85);border-radius:10px;padding:0 7px;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}.stat{position:relative;cursor:pointer;padding:12px 14px}.stat .n{font-size:26px;font-weight:700;margin:2px 0}
.ico{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgb(var(--surf)/.8);color:var(--acc)}
.hero{margin-top:10px;padding:18px 20px}.two-col{display:grid;grid-template-columns:3fr 2fr;gap:10px;margin-top:10px}@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.prow{display:flex;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}.lnk{margin-left:auto;color:var(--acc);cursor:pointer;font-weight:600;white-space:nowrap}
.chip{background:rgb(var(--surf)/.7);border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12.5px}.chip:hover{border-color:var(--acc)}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.uc2{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:12px;align-items:start}.ucg{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.ubox{margin-top:14px;padding:14px 16px;border-radius:10px;background:rgb(var(--surf)/.55);border:1px solid var(--line);border-left:3px solid var(--acc)}.big{font-size:30px;font-weight:700;color:var(--acc);overflow-wrap:anywhere}
@media(max-width:900px){.uc2{grid-template-columns:1fr}}@media(max-width:560px){.ucg{grid-template-columns:1fr}}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px rgb(var(--surf))}#acc{width:44px;height:30px;padding:2px;cursor:pointer}
.btn:not(.g),.chip.on,nav button.on,.toast{color:var(--on,#fff)}
.fc{perspective:900px;height:210px;cursor:pointer}.fci{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}.fc.fl .fci{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;overflow:auto;white-space:pre-wrap;font-size:17px}.fcb{transform:rotateY(180deg)}
@media(prefers-reduced-motion:reduce){.fci{transition:none}}.opt{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--ink);font-size:14px;cursor:pointer}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.pcard{padding:12px;cursor:pointer;transition:transform .15s,border-color .15s}.pcard:hover{transform:translateY(-3px);border-color:var(--acc)}
.pth{height:130px;border-radius:8px;background:rgb(var(--surf)/.7);display:grid;place-items:center;overflow:hidden;color:var(--acc);font-size:36px}.pth img{width:100%;height:100%;object-fit:cover;object-position:top}
.prd{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:var(--base);color:var(--ink)}
.prt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line);background:rgb(var(--surf)/.9)}
.prb{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:auto;scrollbar-gutter:stable;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px))}
@media(prefers-reduced-motion:reduce){.pcard{transition:none}}
#nav{width:216px;padding:10px 8px;transition:width .22s cubic-bezier(.4,0,.2,1);overflow-x:hidden;overflow-y:auto;scrollbar-width:thin}
#nav button{padding:9px 10px;gap:10px;min-height:38px;width:100%}
#nav .ni{display:inline-flex;justify-content:center;width:26px;flex:none;font-style:normal}
#nav .nl{display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .15s}
#nav .badge{display:inline-block;transition:opacity .15s}
#nav .hd{display:flex;align-items:center;gap:6px;margin:2px 0 6px}#nav .hd .tg{width:auto;flex:none}
#nav .brand{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap;transition:opacity .15s}
#nav .lab{transition:color .15s}#nav .ni span{display:block}
#ntip{position:fixed;transform:translateY(-50%);padding:5px 10px;border-radius:7px;background:rgb(var(--surf)/.97);border:1px solid var(--line);color:var(--ink);font-size:12.5px;white-space:nowrap;z-index:70;pointer-events:none;opacity:0;transition:opacity .12s}#ntip.show{opacity:1}
#nbd{display:none}.hb{display:none}
@media(min-width:701px){#nav.c{width:62px}#nav.c .nl,#nav.c .badge,#nav.c .brand{opacity:0;pointer-events:none}#nav.c .lab{display:block;color:transparent;position:relative}#nav.c .lab::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:1px;background:var(--line)}}
@media(max-width:700px){#nav{position:fixed;left:0;top:0;bottom:0;margin:0;width:250px;max-width:84vw;z-index:60;border-radius:0 12px 12px 0;background:rgb(var(--surf)/max(var(--a),.88));transform:translateX(-105%);visibility:hidden;transition:transform .22s cubic-bezier(.4,0,.2,1),visibility 0s .22s;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#nav.open{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.4,0,.2,1),visibility 0s}
#nbd{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .22s;z-index:55}#nbd.show{opacity:1;pointer-events:auto}.hb{display:inline-flex}#ntip{display:none}}
@media(prefers-reduced-motion:reduce){#nav,#nav .nl,#nav .badge,#nav .brand,#nav .lab,#nbd,#ntip{transition:none!important}}
.logo.ic{background:none;border-radius:22%;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.35)}.logo.ic img{width:100%;height:100%;display:block}
</style>

<body>

<div id="nbd"></div><nav class="glass" id="nav" aria-label="Main navigation"></nav><div id="ntip" role="tooltip"></div>

</div>
<script>
const $=s=>document.querySelector(s);
const APPICON='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs> <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152a"/><stop offset=".52" stop-color="#0a4a62"/><stop offset="1" stop-color="#0fa393"/></linearGradient> <radialGradient id="gw" cx=".25" cy=".15" r=".8"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".34"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient> <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient> </defs><clipPath id="rr"><rect width="512" height="512" rx="116"/></clipPath><g clip-path="url(#rr)"><rect width="512" height="512" fill="url(#bg)"/><rect width="512" height="512" fill="url(#gw)"/><rect width="512" height="260" fill="url(#gloss)"/></g> <defs> <clipPath id="fc"><path d="M226 106 V206 L128 358 Q112 388 132 402 Q142 410 158 410 H354 Q370 410 380 402 Q400 388 384 358 L286 206 V106 Z"/></clipPath> <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ef0e0"/><stop offset="1" stop-color="#19b3a1"/></linearGradient> <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient> </defs> <g> <path d="M226 106 V206 L128 358 Q112 388 132 402 Q142 410 158 410 H354 Q370 410 380 402 Q400 388 384 358 L286 206 V106 Z" fill="url(#gl)"/> <g clip-path="url(#fc)"> <path d="M90 322 C146 296 190 346 252 322 S352 298 430 326 V440 H90 Z" fill="url(#liq)"/> <path d="M90 322 C146 296 190 346 252 322 S352 298 430 326" fill="none" stroke="#d9fffa" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/> <circle cx="214" cy="366" r="11" fill="#fff" fill-opacity=".78"/><circle cx="262" cy="346" r="7" fill="#fff" fill-opacity=".7"/> <circle cx="304" cy="376" r="13" fill="#fff" fill-opacity=".72"/><circle cx="248" cy="388" r="6" fill="#fff" fill-opacity=".65"/><circle cx="338" cy="352" r="5" fill="#fff" fill-opacity=".6"/> </g> <path d="M226 106 V206 L128 358 Q112 388 132 402 Q142 410 158 410 H354 Q370 410 380 402 Q400 388 384 358 L286 206 V106" fill="none" stroke="#eafffb" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/> <rect x="202" y="84" width="108" height="24" rx="12" fill="#eafffb"/> <path d="M240 128 V204 L172 308" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="7" stroke-linecap="round"/> <polygon points="422.6,196.0 388.0,216.0 353.4,196.0 353.4,156.0 388.0,136.0 422.6,156.0" fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="8" stroke-linejoin="round"/> <circle cx="422.6" cy="196.0" r="7.5" fill="#fff"/><circle cx="388.0" cy="216.0" r="7.5" fill="#fff"/><circle cx="353.4" cy="196.0" r="7.5" fill="#fff"/><circle cx="353.4" cy="156.0" r="7.5" fill="#fff"/><circle cx="388.0" cy="136.0" r="7.5" fill="#fff"/><circle cx="422.6" cy="156.0" r="7.5" fill="#fff"/> <line x1="422.6" y1="156.0" x2="438" y2="112" stroke="#fff" stroke-opacity=".92" stroke-width="8" stroke-linecap="round"/><circle cx="438" cy="112" r="9" fill="#4fd1c5" stroke="#fff" stroke-width="5"/> <line x1="132" y1="196" x2="168" y2="150" stroke="#fff" stroke-opacity=".85" stroke-width="7" stroke-linecap="round"/> <circle cx="132" cy="196" r="9" fill="#fff"/><circle cx="168" cy="150" r="7" fill="#4fd1c5" stroke="#fff" stroke-width="4"/> </g></svg>`);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={theme:'auto',a:.55,notes:[],saved:[],recent:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('chemai')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('chemai',JSON.stringify(S))}catch(e){toast('Could not save: storage is unavailable or full')}};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function applyLook(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme);r.style.setProperty('--a',S.a);accent(r);
let bg='';try{bg=localStorage.getItem('chemai_bg')||''}catch(e){}document.body.style.backgroundImage=bg?`url(${bg})`:''}
const fmt=n=>String(+Number(n).toPrecision(6));
const R=8.314462618;
/* ---------- Calculators: no defaults, no invented properties ---------- */
const need=(v,k,test,msg)=>{if(!isFinite(v[k])||!test(v[k]))throw new Error(msg)};
const pos=(v,k,l)=>need(v,k,x=>x>0,l+' must be a number greater than 0');
const CALCS=[
{id:'re',cat:'Fluid mechanics',name:'Reynolds number',f:'Re = ρ·u·D / μ',
 in:[['rho','Density ρ','kg/m³'],['u','Velocity u','m/s'],['D','Pipe diameter D','m'],['mu','Viscosity μ','Pa·s']],
 run(v){['rho','u','D','mu'].forEach(k=>pos(v,k,k));const re=v.rho*v.u*v.D/v.mu;
  const reg=re<2100?'laminar':re<4000?'transitional':'turbulent';
  return{steps:[`Re = (${v.rho})(${v.u})(${v.D}) / ${v.mu}`,`Re = ${fmt(re)}`,`Regime (pipe-flow limits 2100 and 4000): ${reg}`],res:['Re',fmt(re),'']}}},
{id:'ig',cat:'Thermodynamics',name:'Ideal gas law (pressure)',f:'P = n·R·T / V,  R = 8.314462618 J/(mol·K)',
 in:[['n','Amount n','mol'],['T','Temperature T','K'],['V','Volume V','m³']],
 run(v){['n','T','V'].forEach(k=>pos(v,k,k));const p=v.n*R*v.T/v.V;
  return{steps:[`P = (${v.n})(${R})(${v.T}) / ${v.V}`,`P = ${fmt(p)} Pa = ${fmt(p/1000)} kPa`],res:['P',fmt(p/1000),'kPa']}}},
{id:'ant',cat:'Thermodynamics',name:'Antoine equation (vapor pressure)',f:'log₁₀P = A − B / (C + T)  (use constants from your reference; units must match theirs)',
 in:[['A','Constant A','–'],['B','Constant B','–'],['C','Constant C','–'],['T','Temperature T (as the constants require)','°C']],
 run(v){['A','B','C','T'].forEach(k=>need(v,k,x=>true,k+' must be a number'));if(v.C+v.T===0)throw new Error('C + T must not be zero');
  const l=v.A-v.B/(v.C+v.T),p=Math.pow(10,l);
  return{steps:[`log₁₀P = ${v.A} − ${v.B} / (${v.C} + ${v.T}) = ${fmt(l)}`,`P = 10^${fmt(l)} = ${fmt(p)}`,'Pressure is in the unit your constants were fitted for (commonly mmHg).'],res:['P',fmt(p),'(constants’ unit)']}}},
{id:'arr',cat:'Reaction engineering',name:'Arrhenius equation',f:'k = A·exp(−Ea / (R·T))',
 in:[['A','Pre-exponential factor A','same as k'],['Ea','Activation energy Ea','J/mol'],['T','Temperature T','K']],
 run(v){pos(v,'A','A');need(v,'Ea',x=>x>=0,'Ea must be 0 or greater');pos(v,'T','T');const k=v.A*Math.exp(-v.Ea/(R*v.T));
  return{steps:[`Ea/(R·T) = ${v.Ea} / (${R}·${v.T}) = ${fmt(v.Ea/(R*v.T))}`,`k = ${v.A}·exp(−${fmt(v.Ea/(R*v.T))}) = ${fmt(k)}`],res:['k',fmt(k),'same units as A']}}},
{id:'cstr',cat:'Reaction engineering',name:'CSTR volume, first-order',f:'V = v₀·X / (k·(1 − X))',
 in:[['v0','Volumetric flow v₀','L/min'],['k','Rate constant k','1/min'],['X','Conversion X (0 to <1)','–']],
 run(v){pos(v,'v0','v₀');pos(v,'k','k');need(v,'X',x=>x>=0&&x<1,'X must be at least 0 and less than 1');const V=v.v0*v.X/(v.k*(1-v.X));
  return{steps:['Design: V = F_A0·X / (−r_A), with −r_A = k·C_A0·(1 − X) and F_A0 = v₀·C_A0',`V = (${v.v0})(${v.X}) / (${v.k}·(1 − ${v.X}))`,`V = ${fmt(V)} L`],res:['V',fmt(V),'L']}}},
{id:'pfr',cat:'Reaction engineering',name:'PFR volume, first-order',f:'V = (v₀ / k)·ln(1 / (1 − X))',
 in:[['v0','Volumetric flow v₀','L/min'],['k','Rate constant k','1/min'],['X','Conversion X (0 to <1)','–']],
 run(v){pos(v,'v0','v₀');pos(v,'k','k');need(v,'X',x=>x>=0&&x<1,'X must be at least 0 and less than 1');const V=v.v0/v.k*Math.log(1/(1-v.X));
  return{steps:['Design: V = F_A0 ∫ dX / (−r_A), with −r_A = k·C_A0·(1 − X)',`V = (${v.v0} / ${v.k})·ln(1 / (1 − ${v.X}))`,`V = ${fmt(V)} L`],res:['V',fmt(V),'L']}}},
{id:'dp',cat:'Fluid mechanics',name:'Pipe pressure drop (Haaland)',f:'ΔP = f·(L/D)·ρu²/2;  1/√f = −1.8·log₁₀[(ε/D/3.7)^1.11 + 6.9/Re]  (turbulent, Re > 4000)',
 in:[['rho','Density ρ','kg/m³'],['u','Velocity u','m/s'],['D','Inner diameter D','m'],['mu','Viscosity μ','Pa·s'],['L','Pipe length L','m'],['eps','Roughness ε (0 if smooth)','m']],
 run(v){['rho','u','D','mu','L'].forEach(k=>pos(v,k,k));need(v,'eps',x=>x>=0,'ε must be 0 or greater');const re=v.rho*v.u*v.D/v.mu;
  if(re<=4000)throw new Error(`Re = ${fmt(re)}. Haaland applies to turbulent flow (Re > 4000). For laminar flow use ΔP = 32μLu/D².`);
  const inv=-1.8*Math.log10(Math.pow(v.eps/v.D/3.7,1.11)+6.9/re),f=1/(inv*inv),dp=f*v.L/v.D*v.rho*v.u*v.u/2;
  return{steps:[`Re = ${fmt(re)}`,`1/√f = ${fmt(inv)}, f = ${fmt(f)}`,`ΔP = ${fmt(f)}·(${v.L}/${v.D})·(${v.rho})(${v.u})²/2`,`ΔP = ${fmt(dp)} Pa`],res:['ΔP',fmt(dp/1000),'kPa']}}},
{id:'pump',cat:'Fluid mechanics',name:'Pump power',f:'P = ρ·g·Q·H / η',
 in:[['rho','Density ρ','kg/m³'],['Q','Flow rate Q','m³/s'],['H','Head H','m'],['eta','Efficiency η (0 to 1)','–']],
 run(v){['rho','Q','H'].forEach(k=>pos(v,k,k));need(v,'eta',x=>x>0&&x<=1,'η must be greater than 0 and at most 1');const p=v.rho*9.80665*v.Q*v.H/v.eta;
  return{steps:[`P = (${v.rho})(9.80665)(${v.Q})(${v.H}) / ${v.eta}`,`P = ${fmt(p)} W`],res:['P',fmt(p/1000),'kW']}}},
{id:'cond',cat:'Heat transfer',name:'Conduction through a plane wall',f:'q = k·A·ΔT / L',
 in:[['k','Thermal conductivity k','W/(m·K)'],['A','Area A','m²'],['dT','Temperature difference ΔT','K'],['L','Thickness L','m']],
 run(v){['k','A','L'].forEach(k=>pos(v,k,k));need(v,'dT',x=>true,'ΔT must be a number');const q=v.k*v.A*v.dT/v.L;
  return{steps:[`q = (${v.k})(${v.A})(${v.dT}) / ${v.L}`],res:['q',fmt(q),'W']}}},
{id:'hxa',cat:'Heat transfer',name:'Heat exchanger area',f:'A = Q / (U·ΔT_lm)',
 in:[['Q','Duty Q','W'],['U','Overall coefficient U','W/(m²·K)'],['dt','ΔT_lm','K']],
 run(v){['Q','U','dt'].forEach(k=>pos(v,k,k));const a=v.Q/(v.U*v.dt);return{steps:[`A = ${v.Q} / (${v.U}·${v.dt})`],res:['A',fmt(a),'m²']}}},
{id:'rao',cat:'Thermodynamics',name:'Raoult’s law (binary bubble point)',f:'P = x₁P₁ˢᵃᵗ + x₂P₂ˢᵃᵗ,  y₁ = x₁P₁ˢᵃᵗ / P  (ideal liquid; supply P^sat at your T)',
 in:[['x1','Liquid mole fraction x₁ (0 to 1)','–'],['p1','P₁ˢᵃᵗ','any pressure unit'],['p2','P₂ˢᵃᵗ','same unit']],
 run(v){need(v,'x1',x=>x>=0&&x<=1,'x₁ must be between 0 and 1');pos(v,'p1','P₁ˢᵃᵗ');pos(v,'p2','P₂ˢᵃᵗ');const p=v.x1*v.p1+(1-v.x1)*v.p2,y=v.x1*v.p1/p;
  return{steps:[`P = (${v.x1})(${v.p1}) + (${fmt(1-v.x1)})(${v.p2}) = ${fmt(p)}`,`y₁ = (${v.x1})(${v.p1}) / ${fmt(p)} = ${fmt(y)}`],res:['P',fmt(p),'(input unit); y₁ = '+fmt(y)]}}},
{id:'mw',cat:'CHE 200 essentials',name:'Molar mass from formula',f:'M = Σ (atoms of element × atomic mass)',
 in:[['f','Formula, e.g. Ca(OH)2','text','t']],
 run(v){if(!v.f)throw new Error('Enter a formula');const c=parseF(v.f);let t=0;const st=[];for(const e in c){if(!AW[e])throw new Error('No atomic mass stored for '+e);const x=c[e]*AW[e];t+=x;st.push(`${e}: ${c[e]} × ${AW[e]} = ${fmt(x)}`)}return{steps:[...st,'Hydrates (·) and charges are not supported; add the water as its own term'],res:['M',fmt(t),'g/mol']}}},
{id:'mol',cat:'CHE 200 essentials',name:'Molarity from mass',f:'M = (m / M_r) / V',
 in:[['m','Mass of solute m','g'],['mr','Molar mass M_r','g/mol'],['V','Solution volume V','L']],
 run(v){['m','mr','V'].forEach(k=>pos(v,k,k));const n=v.m/v.mr;return{steps:[`n = ${v.m} / ${v.mr} = ${fmt(n)} mol`,`M = ${fmt(n)} / ${v.V}`],res:['M',fmt(n/v.V),'mol/L']}}},
{id:'mal',cat:'CHE 200 essentials',name:'Molality from mass',f:'b = (m / M_r) / m_solvent',
 in:[['m','Mass of solute m','g'],['mr','Molar mass M_r','g/mol'],['ms','Mass of solvent','kg']],
 run(v){['m','mr','ms'].forEach(k=>pos(v,k,k));const n=v.m/v.mr;return{steps:[`n = ${v.m} / ${v.mr} = ${fmt(n)} mol`,`b = ${fmt(n)} / ${v.ms}`],res:['b',fmt(n/v.ms),'mol/kg']}}},
{id:'dil',cat:'CHE 200 essentials',name:'Dilution (M₁V₁ = M₂V₂)',f:'V₁ = M₂V₂ / M₁',
 in:[['m1','Stock concentration M₁','mol/L'],['m2','Target concentration M₂','mol/L'],['v2','Target volume V₂','L']],
 run(v){['m1','m2','v2'].forEach(k=>pos(v,k,k));if(v.m2>v.m1)throw new Error('M₂ is higher than M₁, so this would be a concentration, not a dilution');const v1=v.m2*v.v2/v.m1;return{steps:[`V₁ = (${v.m2})(${v.v2}) / ${v.m1}`,`Add solvent to make up ${fmt(v.v2-v1)} L (volumes assumed additive)`],res:['V₁',fmt(v1),'L of stock']}}},
{id:'boy',cat:'CHE 200 essentials',name:'Boyle’s law',f:'P₁V₁ = P₂V₂  (constant T and n)  →  P₂ = P₁V₁/V₂',
 in:[['p1','Initial pressure P₁','any pressure unit'],['v1','Initial volume V₁','any volume unit'],['v2','Final volume V₂','same unit as V₁']],
 run(v){['p1','v1','v2'].forEach(k=>pos(v,k,k));const p=v.p1*v.v1/v.v2;return{steps:[`P₂ = (${v.p1})(${v.v1}) / ${v.v2}`],res:['P₂',fmt(p),'(same unit as P₁)']}}},
{id:'cha',cat:'CHE 200 essentials',name:'Charles’s law',f:'V₁/T₁ = V₂/T₂  (constant P and n, T absolute)  →  V₂ = V₁T₂/T₁',
 in:[['v1','Initial volume V₁','any volume unit'],['t1','Initial temperature T₁','K'],['t2','Final temperature T₂','K']],
 run(v){['v1','t1','t2'].forEach(k=>pos(v,k,k));const x=v.v1*v.t2/v.t1;return{steps:[`V₂ = (${v.v1})(${v.t2}) / ${v.t1}`],res:['V₂',fmt(x),'(same unit as V₁)']}}},
{id:'igl',cat:'CHE 200 essentials',name:'Ideal gas law (solve for the blank)',f:'PV = nRT,  R = 8.314462618 J/(mol·K)  (leave exactly one field blank)',
 in:[['P','Pressure P','Pa'],['V','Volume V','m³'],['n','Amount n','mol'],['T','Temperature T','K']],
 run(v){const ks=['P','V','n','T'],bl=ks.filter(k=>isNaN(v[k]));if(bl.length!==1)throw new Error('Leave exactly one field blank (the one to solve for)');ks.filter(k=>k!==bl[0]).forEach(k=>pos(v,k,k));
  const r={P:v.n*R*v.T/v.V,V:v.n*R*v.T/v.P,n:v.P*v.V/(R*v.T),T:v.P*v.V/(v.n*R)}[bl[0]];return{steps:[`Solving for ${bl[0]}`,`${bl[0]} = ${fmt(r)}`],res:[bl[0],fmt(r),{P:'Pa',V:'m³',n:'mol',T:'K'}[bl[0]]]}}},
{id:'ph',cat:'CHE 200 essentials',name:'pH and pOH (25 °C)',f:'pH = −log₁₀[H⁺];  pOH = 14 − pH;  [OH⁻] = 10^(−pOH)',
 in:[['h','Hydrogen ion concentration [H⁺]','mol/L']],
 run(v){pos(v,'h','[H⁺]');const ph=-Math.log10(v.h);return{steps:[`pH = −log₁₀(${v.h}) = ${fmt(ph)}`,`pOH = ${fmt(14-ph)}`,`[OH⁻] = ${fmt(Math.pow(10,ph-14))} mol/L`,'Uses K_w = 1×10⁻¹⁴, valid at 25 °C',...(ph<0||ph>14?['Note: pH outside 0 to 14 is possible but means a very strong solution']:[])],res:['pH',fmt(ph),'']}}},
{id:'sto',cat:'CHE 200 essentials',name:'Stoichiometry: mass of B from mass of A',f:'m_B = (m_A/M_A)·(b/a)·M_B  for a A → b B',
 in:[['ma','Mass of A','g'],['mA','Molar mass of A','g/mol'],['a','Coefficient of A','–'],['b','Coefficient of B','–'],['mB','Molar mass of B','g/mol']],
 run(v){['ma','mA','a','b','mB'].forEach(k=>pos(v,k,k));const n=v.ma/v.mA,nb=n*v.b/v.a;return{steps:[`n_A = ${v.ma} / ${v.mA} = ${fmt(n)} mol`,`n_B = ${fmt(n)}·(${v.b}/${v.a}) = ${fmt(nb)} mol`,`m_B = ${fmt(nb)}·${v.mB}`,'Assumes A is the limiting reactant and 100 % yield'],res:['m_B',fmt(nb*v.mB),'g']}}},
{id:'sf',cat:'CHE 200 essentials',name:'Significant figures',f:'Counts significant figures, then rounds to n',
 in:[['s','Number as written, e.g. 0.00340','text','t'],['n','Round to n significant figures','–']],
 run(v){const s=(v.s||'').trim();if(!/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s))throw new Error('Enter a plain number such as 0.00340, 1200 or 6.02e23');need(v,'n',x=>Number.isInteger(x)&&x>=1&&x<=15,'n must be a whole number from 1 to 15');
  const mant=s.replace(/^[+-]/,'').split(/e/i)[0];let d=mant.replace('.','').replace(/^0+/,'');if(!mant.includes('.'))d=d.replace(/0+$/,'');const c=Math.max(d.length,1);
  return{steps:[`Digits that count: "${d||'0'}"`,'Leading zeros never count. Trailing zeros count only after a decimal point; in a whole number like 1200 they are treated as not significant.',`Rounded to ${v.n} s.f.: ${fmt(+parseFloat(s).toPrecision(v.n))}`],res:['Sig figs',String(c),'']}}},
{id:'sci',cat:'CHE 200 essentials',name:'Scientific calculator',f:'Operators + − * / ^ ( ); functions sqrt, exp, log (natural), log10, sin, cos, tan, abs; constants pi, e',
 in:[['ex','Expression, e.g. 2*sqrt(9)+log10(100)','text','t']],
 run(v){if(!v.ex)throw new Error('Enter an expression');const y=mkF(v.ex)(0);if(!isFinite(y))throw new Error('The expression is not a finite number (check for division by zero)');return{steps:[`${v.ex} = ${fmt(y)}`,'Trig functions use radians'],res:['=',fmt(y),'']}}},
{id:'cys',cat:'Material and energy balances',name:'Conversion, yield, selectivity',f:'X = (N_A0 − N_A)/N_A0;  S = ν·N_D/(N_A0 − N_A);  Y = ν·N_D/N_A0 = X·S,  ν = moles A consumed per mole D formed',
 in:[['na0','A fed N_A0','mol'],['na','A leaving N_A','mol'],['nd','Desired product formed N_D','mol'],['nu','ν (stoichiometric ratio)','–']],
 run(v){pos(v,'na0','N_A0');need(v,'na',x=>x>=0&&x<=v.na0,'N_A must be between 0 and N_A0');need(v,'nd',x=>x>=0,'N_D must be 0 or greater');pos(v,'nu','ν');const X=(v.na0-v.na)/v.na0;if(X===0)throw new Error('No A reacted, so selectivity is undefined');const S=v.nu*v.nd/(v.na0-v.na);
  if(S>1+1e-9)throw new Error(`Selectivity would be ${fmt(S)} (above 1): more D formed than the reacted A can supply. Check ν and the data.`);
  return{steps:[`X = (${v.na0} − ${v.na}) / ${v.na0} = ${fmt(X)}`,`S = ${v.nu}·${v.nd} / ${fmt(v.na0-v.na)} = ${fmt(S)}`,`Y = X·S = ${fmt(X*S)}`],res:['Yield',fmt(X*S),'(X = '+fmt(X)+', S = '+fmt(S)+')']}}},
{id:'rcp',cat:'Material and energy balances',name:'Recycle with purge (reactor + separator)',f:'N₀ = F / (1 − (1−p)(1−X_sp));  R = (1−p)N₀(1−X_sp);  P = p·N₀(1−X_sp)',
 in:[['F','Fresh feed of A, F','mol/h'],['X','Single-pass conversion X_sp (0 to 1)','–'],['p','Purge fraction p (0 to 1)','–']],
 run(v){pos(v,'F','F');need(v,'X',x=>x>0&&x<=1,'X_sp must be greater than 0 and at most 1');need(v,'p',x=>x>=0&&x<=1,'p must be between 0 and 1');const u=1-v.X,N0=v.F/(1-(1-v.p)*u),un=N0*u,Rc=(1-v.p)*un,P=v.p*un;
  return{steps:['Assumes: one reaction, only unreacted A is recycled/purged, perfect separation of product, steady state','Balance on reactor mixing point: N₀ = F + R, with R = (1−p)·N₀·(1−X_sp)',`N₀ = ${v.F} / (1 − ${fmt(1-v.p)}·${fmt(u)}) = ${fmt(N0)} mol/h`,`Recycle R = ${fmt(Rc)} mol/h,  purge P = ${fmt(P)} mol/h`,`Overall conversion = (F − P)/F = ${fmt((v.F-P)/v.F)}`],res:['Reactor feed N₀',fmt(N0),'mol/h']}}},
{id:'vel',cat:'Fluid mechanics',name:'Flow velocity in a pipe',f:'u = Q / A,  A = πD²/4',
 in:[['Q','Volumetric flow Q','m³/s'],['D','Inner diameter D','m']],
 run(v){pos(v,'Q','Q');pos(v,'D','D');const A=Math.PI*v.D*v.D/4,u=v.Q/A;return{steps:[`A = π(${v.D})²/4 = ${fmt(A)} m²`,`u = ${v.Q} / ${fmt(A)} = ${fmt(u)} m/s`,...(u>6?['Note: above about 3 to 6 m/s is unusual for liquid lines']:[])],res:['u',fmt(u),'m/s']}}},
{id:'hd',cat:'Fluid mechanics',name:'Pump head (Bernoulli with losses)',f:'H = (P₂−P₁)/(ρg) + (u₂²−u₁²)/(2g) + (z₂−z₁) + h_f',
 in:[['rho','Density ρ','kg/m³'],['p1','Inlet pressure P₁ (absolute)','Pa'],['p2','Outlet pressure P₂ (absolute)','Pa'],['u1','Inlet velocity u₁','m/s'],['u2','Outlet velocity u₂','m/s'],['z1','Inlet elevation z₁','m'],['z2','Outlet elevation z₂','m'],['hf','Friction head loss h_f','m']],
 run(v){pos(v,'rho','ρ');['p1','p2'].forEach(k=>pos(v,k,k));['u1','u2'].forEach(k=>need(v,k,x=>x>=0,k+' must be 0 or greater'));['z1','z2'].forEach(k=>need(v,k,x=>true,k+' must be a number'));need(v,'hf',x=>x>=0,'h_f must be 0 or greater');
  const g=9.80665,H=(v.p2-v.p1)/(v.rho*g)+(v.u2*v.u2-v.u1*v.u1)/(2*g)+(v.z2-v.z1)+v.hf;
  return{steps:[`Pressure head = ${fmt((v.p2-v.p1)/(v.rho*g))} m`,`Velocity head = ${fmt((v.u2*v.u2-v.u1*v.u1)/(2*g))} m`,`Elevation + friction = ${fmt(v.z2-v.z1+v.hf)} m`,`H = ${fmt(H)} m`,...(H<=0?['Warning: H ≤ 0 means no pump work is needed for these conditions']:[])],res:['H',fmt(H),'m']}}},
{id:'mcp',cat:'Heat transfer',name:'Sensible heat, Q = m·cp·ΔT',f:'Q = ṁ·c_p·ΔT',
 in:[['m','Mass flow ṁ','kg/s'],['cp','Specific heat c_p','kJ/(kg·K)'],['dT','Temperature change ΔT','K']],
 run(v){pos(v,'m','ṁ');pos(v,'cp','c_p');need(v,'dT',x=>true,'ΔT must be a number');const q=v.m*v.cp*v.dT;return{steps:[`Q = (${v.m})(${v.cp})(${v.dT}) = ${fmt(q)} kW`],res:['Q',fmt(q),'kW']}}},
{id:'uh',cat:'Heat transfer',name:'Overall coefficient U from duty',f:'U = Q / (A·ΔT_lm)',
 in:[['Q','Duty Q','W'],['A','Area A','m²'],['dt','ΔT_lm','K']],
 run(v){['Q','A','dt'].forEach(k=>pos(v,k,k));const u=v.Q/(v.A*v.dt);return{steps:[`U = ${v.Q} / (${v.A}·${v.dt})`],res:['U',fmt(u),'W/(m²·K)']}}},
{id:'db',cat:'Heat transfer',name:'Heat-transfer coefficient (Dittus–Boelter)',f:'Nu = 0.023·Re^0.8·Pr^n;  h = Nu·k/D  (n = 0.4 heating, 0.3 cooling)',
 in:[['re','Reynolds number Re','–'],['pr','Prandtl number Pr','–'],['k','Fluid conductivity k','W/(m·K)'],['D','Tube diameter D','m'],['n','Exponent n (0.4 heating, 0.3 cooling)','–']],
 run(v){pos(v,'re','Re');pos(v,'pr','Pr');pos(v,'k','k');pos(v,'D','D');need(v,'n',x=>x===.4||x===.3,'n must be 0.4 (heating) or 0.3 (cooling)');
  if(v.re<1e4)throw new Error('Dittus–Boelter is valid for fully turbulent flow (Re ≥ 10 000); this Re is '+fmt(v.re));if(v.pr<.6||v.pr>160)throw new Error('Dittus–Boelter is valid for 0.6 ≤ Pr ≤ 160');
  const Nu=.023*Math.pow(v.re,.8)*Math.pow(v.pr,v.n),h=Nu*v.k/v.D;return{steps:[`Nu = 0.023·${v.re}^0.8·${v.pr}^${v.n} = ${fmt(Nu)}`,`h = ${fmt(Nu)}·${v.k} / ${v.D}`],res:['h',fmt(h),'W/(m²·K)']}}},
{id:'fick',cat:'Mass transfer',name:'Steady 1-D diffusion flux (Fick)',f:'J = D·ΔC / Δz',
 in:[['D','Diffusivity D','m²/s'],['dC','Concentration difference ΔC','mol/m³'],['dz','Distance Δz','m']],
 run(v){pos(v,'D','D');need(v,'dC',x=>true,'ΔC must be a number');pos(v,'dz','Δz');const J=v.D*v.dC/v.dz;return{steps:[`J = (${v.D})(${v.dC}) / ${v.dz}`,'Direction: from high to low concentration'],res:['|J|',fmt(Math.abs(J)),'mol/(m²·s)']}}},
{id:'fo',cat:'Process control',name:'First-order step response',f:'y(t) = K·Δu·(1 − e^(−t/τ))',
 in:[['K','Process gain K','output/input'],['du','Step size Δu','input units'],['tau','Time constant τ','s'],['t','Time t','s']],
 run(v){need(v,'K',x=>true,'K must be a number');need(v,'du',x=>true,'Δu must be a number');pos(v,'tau','τ');need(v,'t',x=>x>=0,'t must be 0 or greater');const y=v.K*v.du*(1-Math.exp(-v.t/v.tau));
  return{steps:[`t/τ = ${fmt(v.t/v.tau)}`,`y = ${v.K}·${v.du}·(1 − e^(−${fmt(v.t/v.tau)})) = ${fmt(y)}`,`Fraction of final value reached: ${fmt(100*(1-Math.exp(-v.t/v.tau)))} %`],res:['y(t)',fmt(y),'output units']}}},
{id:'pe',cat:'Modern physics',name:'Photoelectric effect',f:'E = hc/λ;  KE_max = E − φ;  V_stop = KE_max/e;  λ₀ = hc/φ  (hc = 1239.84198 eV·nm)',
 in:[['lam','Light wavelength λ','nm'],['phi','Work function φ','eV']],
 run(v){pos(v,'lam','λ');pos(v,'phi','φ');const E=1239.84198/v.lam,l0=1239.84198/v.phi,k=E-v.phi,st=[`Photon energy E = 1239.84198 / ${v.lam} = ${fmt(E)} eV`,`Threshold wavelength λ₀ = 1239.84198 / ${v.phi} = ${fmt(l0)} nm`];
  if(k<=0)return{steps:[...st,`E ≤ φ, so no electrons are emitted. Use light shorter than ${fmt(l0)} nm`],res:['KE_max','0 (no emission)','']};
  return{steps:[...st,`KE_max = ${fmt(E)} − ${v.phi} = ${fmt(k)} eV`,`Stopping potential = ${fmt(k)} V`],res:['KE_max',fmt(k),'eV']}}},
{id:'dbw',cat:'Modern physics',name:'de Broglie wavelength',f:'λ = h / (m·v),  h = 6.62607015×10⁻³⁴ J·s',
 in:[['m','Mass m','kg'],['v','Speed v','m/s']],
 run(v){pos(v,'m','m');pos(v,'v','v');if(v.v>=299792458)throw new Error('v must be below the speed of light');const l=6.62607015e-34/(v.m*v.v);return{steps:[`λ = 6.62607015e-34 / (${v.m}·${v.v}) = ${l.toExponential(4)} m`,...(v.v>2.99792458e7?['Warning: above 0.1c the non-relativistic momentum m·v is inaccurate; use p = γmv']:[])],res:['λ',fmt(l*1e9),'nm']}}},

function vBal(m){m.innerHTML=`<h2>Chemical equation balancer</h2><div class="card glass" style="max-width:640px"><label>Unbalanced equation</label><input id="be" placeholder="e.g. C3H8 + O2 -> CO2 + H2O"><div class="mut" style="margin-top:6px">Separate species with + and sides with ->. Parentheses work. Charges and state symbols are not supported.</div><div class="row"><button class="btn" id="bb">Balance</button></div><div id="bo"></div></div>`;
 const run=()=>{try{const r=balance($('#be').value);$('#bo').innerHTML=`<div class="res">${esc(r.text)}</div>`+r.check.map(s=>`<div class="step">${esc(s)}</div>`).join('')}catch(e){$('#bo').innerHTML=`<div class="err">${esc(e.message)}</div>`}};$('#bb').onclick=run;$('#be').onkeydown=e=>{if(e.key==='Enter')run()}}
function vSet(m){m.innerHTML=`<h2>Settings</h2><div class="grid"><div class="card glass"><h3>Appearance</h3><label>Your name (for the greeting)</label><input id="sn"><label>Theme</label><select id="th"><option value="auto">Match system</option><option value="light">Light</option><option value="dark">Dark</option></select><label>Accent colour</label><div class="row" id="ac" style="margin:0;align-items:center">${Object.entries(ACC).map(([k,v])=>`<button class="sw" data-a="${k}" title="${k==='teal'?'Default (teal)':v[0]}" aria-label="${v[0]} accent" style="background:${v[1]||'#0b7a75'}"></button>`).join('')}<input type="color" id="acc" title="Custom colour" aria-label="Custom accent colour"></div><label>Panel transparency</label><input id="al" type="range" min="0.2" max="0.95" step="0.05"><label>Background image</label><input id="bg" type="file" accept="image/*"><div class="row"><button class="btn g" id="cb">Remove background</button></div></div>
 <div class="card glass"><h3>Backup and restore</h3><textarea id="bk" style="min-height:130px"></textarea><div class="row"><button class="btn g" id="ex">Show backup</button><button class="btn" id="im">Restore from text</button></div></div></div>`;
 $('#th').value=S.theme;$('#sn').value=who();$('#sn').oninput=e=>{S.name=e.target.value.trim();save()};
 const swr=()=>document.querySelectorAll('#ac .sw').forEach(b=>b.classList.toggle('on',b.dataset.a===(S.accent||'teal')));swr();document.querySelectorAll('#ac .sw').forEach(b=>b.onclick=()=>{S.accent=b.dataset.a;save();applyLook();swr()});$('#acc').value=S.accentC||'#0b7a75';$('#acc').oninput=e=>{S.accent='custom';S.accentC=e.target.value;save();applyLook();swr()};$('#al').value=S.a;
 $('#th').onchange=e=>{S.theme=e.target.value;save();applyLook();renderTop()};
 $('#al').oninput=e=>{S.a=+e.target.value;save();applyLook()};
 $('#bg').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem('chemai_bg',r.result);applyLook()}catch(x){toast('Image too large to store. Try a smaller one.')}};r.readAsDataURL(f)};
 $('#cb').onclick=()=>{try{localStorage.removeItem('chemai_bg')}catch(e){}applyLook()};
 $('#ex').onclick=()=>{$('#bk').value=JSON.stringify(S)};
 $('#im').onclick=()=>{try{const d=JSON.parse($('#bk').value);if(!Array.isArray(d.notes)||!Array.isArray(d.saved))throw 0;S={...S,...d};save();applyLook();toast('Restored')}catch(e){toast('That text is not a valid backup')}}}
applyLook();render();
</script>
